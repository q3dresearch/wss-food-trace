linkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a3aa7" text-anchor="middle" font-weight="normal">all 55.8%</text><text x="196.0" y="520.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">filed once</text><text x="196.0" y="535.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">n=19</text><line x1="268.2" y1="516.0" x2="599.2" y2="516.0" stroke="#6b7684" stroke-width="2.2"/><line x1="268.2" y1="511.0" x2="268.2" y2="521.0" stroke="#6b7684" stroke-width="2.2"/><line x1="599.2" y1="511.0" x2="599.2" y2="521.0" stroke="#6b7684" stroke-width="2.2"/><circle cx="437.3" cy="516.0" r="5.5" fill="#6b7684" stroke="none" stroke-width="1"/><text x="611.2" y="520.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="600">52.6%</text><text x="196.0" y="566.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">2-3 times</text><text x="196.0" y="581.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">n=37</text><line x1="363.4" y1="562.0" x2="607.1" y2="562.0" stroke="#6b7684" stroke-width="2.2"/><line x1="363.4" y1="557.0" x2="363.4" y2="567.0" stroke="#6b7684" stroke-width="2.2"/><line x1="607.1" y1="557.0" x2="607.1" y2="567.0" stroke="#6b7684" stroke-width="2.2"/><circle cx="492.4" cy="562.0" r="5.5" fill="#6b7684" stroke="none" stroke-width="1"/><text x="619.1" y="566.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="600">59.5%</text><text x="196.0" y="612.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">4-9 times</text><text x="196.0" y="627.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">n=30</text><line x1="304.0" y1="608.0" x2="575.7" y2="608.0" stroke="#6b7684" stroke-width="2.2"/><line x1="304.0" y1="603.0" x2="304.0" y2="613.0" stroke="#6b7684" stroke-width="2.2"/><line x1="575.7" y1="603.0" x2="575.7" y2="613.0" stroke="#6b7684" stroke-width="2.2"/><circle cx="442.9" cy="608.0" r="5.5" fill="#6b7684" stroke="none" stroke-width="1"/><text x="587.7" y="612.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="600">53.3%</text><text x="40.0" y="688.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">Read the intervals, not the ranking</text><text x="40.0" y="710.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">The top and bottom of the human series are genuinely apart: filing ten or more times clears 90.7% against 75.1% for two-to-three, which is 4.0 standard errors. But the</text><text x="40.0" y="728.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">sequence is not a ladder — one-time filers beat the 2-3 group by 6.3 points, and that gap is only 2.3 standard errors. Whatever practice buys, it does not accumulate</text><text x="40.0" y="746.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">evenly, and the simplest story — file more, learn more, clear more — does not survive its own second row. The animal series has no gradient at all and intervals three</text><text x="40.0" y="764.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">times wider; on 86 closed notices it cannot resolve one.</text><text x="40.0" y="886.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: FDA GRAS and Animal Food GRAS notice inventories, in reference/. Pending notices excluded. Buckets with fewer than 10 closed notices omitted. Chart: examples/visualize.py</text></svg>