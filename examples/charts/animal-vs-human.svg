<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="676" viewBox="0 0 1080 676"><rect width="1080" height="676" fill="#ffffff"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#1c2530" text-anchor="start" font-weight="600">The same instrument, two very different gates</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">Every GRAS notice FDA has closed, human and animal, by the conclusion FDA reached. Pending notices are excluded — they have no outcome yet.</text><rect x="40.0" y="111.0" width="11.0" height="11.0" fill="#2a78d6" fill-opacity="0.9"/><text x="57.0" y="120.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">FDA has no questions</text><rect x="206.0" y="111.0" width="11.0" height="11.0" fill="#eb6834" fill-opacity="0.9"/><text x="223.0" y="120.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">withdrawn at notifier's request</text><rect x="439.6" y="111.0" width="11.0" height="11.0" fill="#4a3aa7" fill-opacity="0.9"/><text x="456.6" y="120.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">no basis for a GRAS determination</text><text x="154.0" y="234.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#1c2530" text-anchor="end" font-weight="600">Animal food</text><text x="154.0" y="254.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal">86 closed</text><text x="154.0" y="270.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal">of 94 filed</text><rect x="176.0" y="208.0" width="337.1" height="66.0" fill="#2a78d6" fill-opacity="0.9"/><text x="188.0" y="238.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#ffffff" text-anchor="start" font-weight="700">55.8%</text><text x="188.0" y="258.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#ffffff" text-anchor="start" font-weight="normal">48</text><rect x="513.1" y="208.0" width="224.7" height="66.0" fill="#eb6834" fill-opacity="0.9"/><text x="525.1" y="238.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#ffffff" text-anchor="start" font-weight="700">37.2%</text><text x="525.1" y="258.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#ffffff" text-anchor="start" font-weight="normal">32</text><rect x="737.9" y="208.0" width="42.1" height="66.0" fill="#4a3aa7" fill-opacity="0.9"/><text x="798.0" y="242.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">55.8% cleared</text><text x="154.0" y="352.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#1c2530" text-anchor="end" font-weight="600">Human food</text><text x="154.0" y="372.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal">1,301 closed</text><text x="154.0" y="388.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal">of 1,336 filed</text><rect x="176.0" y="326.0" width="490.3" height="66.0" fill="#2a78d6" fill-opacity="0.9"/><text x="188.0" y="356.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#ffffff" text-anchor="start" font-weight="700">81.2%</text><text x="188.0" y="376.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#ffffff" text-anchor="start" font-weight="normal">1,056</text><rect x="666.3" y="326.0" width="104.5" height="66.0" fill="#eb6834" fill-opacity="0.9"/><text x="678.3" y="356.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#ffffff" text-anchor="start" font-weight="700">17.3%</text><text x="678.3" y="376.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#ffffff" text-anchor="start" font-weight="normal">225</text><rect x="770.7" y="326.0" width="9.3" height="66.0" fill="#4a3aa7" fill-opacity="0.9"/><text x="798.0" y="360.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">81.2% cleared</text><text x="40.0" y="484.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">What is and is not safe to say here</text><text x="40.0" y="506.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">The withdrawal gap is the solid part: 37.2% against 17.3%, about 3.8 standard errors on 86 closed animal notices. Real, not noise. The rejection gap runs the</text><text x="40.0" y="524.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">same way but rests on 6 events, so quote it as “6 of 86” rather than as a multiple. And neither number explains itself: a lower pass rate could mean stricter</text><text x="40.0" y="542.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">review, weaker submissions, or a thinner evidence base to draw on. FDA announced in August 2024 that it was evaluating both animal programmes.</text><text x="40.0" y="658.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: FDA GRAS Notice Inventory (human) and Animal Food GRAS Notices Inventory, both in reference/. Outcome is FDA's own letter text, classified verbatim. Chart: examples/visualize.py</text></svg>