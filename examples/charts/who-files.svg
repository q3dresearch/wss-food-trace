ight="normal"> 32   Novozymes North America Inc.</text><text x="786.0" y="231.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal"> 22   DSM Food Specialties</text><text x="786.0" y="248.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal"> 18   Cargill Inc.</text><text x="786.0" y="265.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal"> 15   Glycom A/S</text><text x="786.0" y="282.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal"> 14   AB Enzymes Inc.</text><text x="786.0" y="299.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal"> 12   Chr. Hansen A/S</text><text x="228.0" y="334.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1c2530" text-anchor="end" font-weight="600">Animal food</text><text x="228.0" y="354.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal">48 notifiers</text><text x="228.0" y="370.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal">94 notices</text><rect x="250.0" y="316.0" width="141.1" height="52.0" fill="#eb6834" fill-opacity="0.9"/><text x="261.0" y="340.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#ffffff" text-anchor="start" font-weight="700">28%</text><text x="261.0" y="358.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#ffffff" text-anchor="start" font-weight="normal">filed once</text><rect x="391.1" y="316.0" width="141.1" height="52.0" fill="#2a78d6" fill-opacity="0.77"/><text x="402.1" y="340.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#ffffff" text-anchor="start" font-weight="700">28%</text><text x="402.1" y="358.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#ffffff" text-anchor="start" font-weight="normal">2</text><rect x="532.1" y="316.0" width="65.1" height="52.0" fill="#2a78d6" fill-opacity="0.64"/><text x="543.1" y="340.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#ffffff" text-anchor="start" font-weight="700">13%</text><text x="543.1" y="358.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#ffffff" text-anchor="start" font-weight="normal">3</text><rect x="597.2" y="316.0" width="76.0" height="52.0" fill="#2a78d6" fill-opacity="0.51"/><text x="608.2" y="340.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#ffffff" text-anchor="start" font-weight="700">15%</text><text x="608.2" y="358.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#ffffff" text-anchor="start" font-weight="normal">4-6</text><rect x="673.2" y="316.0" width="86.8" height="52.0" fill="#2a78d6" fill-opacity="0.38"/><text x="684.2" y="340.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#ffffff" text-anchor="start" font-weight="700">17%</text><text x="684.2" y="358.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#ffffff" text-anchor="start" font-weight="normal">7+</text><text x="250.0" y="388.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">share of all notices, by how many that notifier filed</text><text x="786.0" y="326.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" text-anchor="start" font-weight="600">most frequent filers</text><text x="786.0" y="346.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">  9   CJ CheilJedang Corporation</text><text x="786.0" y="363.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">  7   Native Microbials, Inc. (forme</text><text x="786.0" y="380.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">  5   DSM Nutritional Products</text><text x="786.0" y="397.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">  5   Agrivida, Inc.</text><text x="786.0" y="414.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">  4   Lallemand Specialties Inc., do</text><text x="786.0" y="431.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">  3   Emerald Carolina Chemicals LLC</text><text x="40.0" y="486.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">Why this cuts against the obvious story</text><text x="40.0" y="508.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">503 of 745 human-food notifiers filed exactly once, and the ten most frequent between them account for 12% of all notices. That is not the shape of a captured process run by</text><text x="40.0" y="526.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">a handful of incumbents — it is mostly one-off filers who never come back. Whatever is wrong with the GRAS route, “a few big companies use it repeatedly” is not the</text><text x="40.0" y="544.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">description. The animal side is smaller and slightly more concentrated, but the same shape.</text><text x="40.0" y="642.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: FDA GRAS and Animal Food GRAS notice inventories, in reference/. Notifier names are normalised on their first 14 letters, so a renamed subsidiary may split. Chart: examples/visualize.py</text></svg>