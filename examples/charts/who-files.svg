<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660"><rect width="1160" height="660" fill="#ffffff"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#1c2530" text-anchor="start" font-weight="600">The gate is a long tail, not a concentrated industry</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">Every GRAS notice ever filed, grouped by how many its notifier has filed in total. Most companies appear once and never again.</text><text x="228.0" y="202.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1c2530" text-anchor="end" font-weight="600">Human food</text><text x="228.0" y="222.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal">745 notifiers</text><text x="228.0" y="238.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal">1,336 notices</text><rect x="250.0" y="184.0" width="192.0" height="52.0" fill="#eb6834" fill-opacity="0.9"/><text x="261.0" y="208.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#ffffff" text-anchor="start" font-weight="700">38%</text><text x="261.0" y="226.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#ffffff" text-anchor="start" font-weight="normal">filed once</text><rect x="442.0" y="184.0" width="101.5" height="52.0" fill="#2a78d6" fill-opacity="0.77"/><text x="453.0" y="208.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvet