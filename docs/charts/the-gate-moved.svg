 height="109.1" fill="#2a78d6" fill-opacity="0.85"/><rect x="1082.7" y="491.8" width="20.6" height="18.2" fill="#6b7684" fill-opacity="0.5"/><rect x="1082.7" y="400.9" width="20.6" height="90.9" fill="#2a78d6" fill-opacity="0.85"/><text x="1093.0" y="528.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">2025</text><rect x="1111.4" y="505.5" width="20.6" height="4.5" fill="#6b7684" fill-opacity="0.5"/><rect x="1111.4" y="430.5" width="20.6" height="75.0" fill="#2a78d6" fill-opacity="0.85"/><line x1="76" y1="510" x2="1136" y2="510" stroke="#1c2530" stroke-width="1.4"/><line x1="362.5" y1="202" x2="362.5" y2="510" stroke="#4a3aa7" stroke-width="1.3" stroke-dasharray="5 4"/><text x="354.5" y="198.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#4a3aa7" text-anchor="end" font-weight="normal">2000 — first effective notification</text><text x="40.0" y="566.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">Why this matters for reading any of these series</text><text x="40.0" y="588.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">Counting granted petitions alone, food additive rulemaking looks like it collapsed: 546 rules in this window, but only 82 of them after 2005. The 1997 FDA Modernization Act</text><text x="40.0" y="606.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">created a notification route for food-contact substances, and from 2000 they used it: 1,636 notifications became effective, against 293 food-contact petitions granted in the</text><text x="40.0" y="624.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">same window. The traffic did not stop — it changed doors, and only one door is in the petition data.</text><text x="40.0" y="728.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: FDA Office of Food Additive Safety — final rules and effective FCS notifications, both retained by the publisher and held in reference/. Chart: examples/visualize.py</text></svg>