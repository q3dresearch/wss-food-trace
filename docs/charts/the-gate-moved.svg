<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="746" viewBox="0 0 1180 746"><rect width="1180" height="746" fill="#ffffff"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#1c2530" text-anchor="start" font-weight="600">The gate did not close — one lane did</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">Food-contact substances stopped arriving as food additive petitions in 2001 and started arriving as notifications instead. Same substances, faster route, more of them.</text><rect x="40.0" y="113.0" width="11.0" height="11.0" fill="#eb6834" fill-opacity="0.9"/><text x="57.0" y="122.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">food-contact petitions granted</text><rect x="267.5" y="113.0" width="11.0" height="11.0" fill="#2a78d6" fill-opacity="0.9"/><text x="284.5" y="122.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">food-contact notifications effective</text><rect x="531.9" y="113.0" width="11.0" height="11.0" fill="#6b7684" fill-opacity="0.9"/><text x="548.9" y="122.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">all other petitions granted</text><line x1="76" y1="510.0" x2="1136" y2="510.0" stroke="#dfe4ea" stroke-width="1"/><text x="66.0" y="514.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">0</text><line x1="76" y1="464.5" x2="1136" y2="464.5" 