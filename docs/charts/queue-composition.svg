<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="692" viewBox="0 0 1080 692"><rect width="1080" height="692" fill="#ffffff"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#1c2530" text-anchor="start" font-weight="600">Abeyance only happens to one kind of petition</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">All 32 food and colour additive petitions open at FDA on 2026-08-19, by what they ask for and where they sit.</text><rect x="40.0" y="103.0" width="11.0" height="11.0" fill="#1c2530" fill-opacity="0.3"/><text x="59.0" y="112.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">lighter = held in abeyance</text><rect x="232.0" y="103.0" width="11.0" height="11.0" fill="#1c2530" fill-opacity="0.75"/><text x="251.0" y="112.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">darker = under review</text><text x="274.0" y="226.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">Asks FDA to permit or expand a use</text><text x="274.0" y="268.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal">25 petitions</text><rect x="300.0" y="210.0" width="382.5" height="62.0" fill="#2a78d6" fill-opacity="0.45"/><text x="312.0" y="240.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#ffffff" text-anchor="start" font-weight="700">17</text><text x="312.0" y="260.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="start" font-weight="normal">held in abeyance</text><rect x="682.5" y="210.0" width="180.0" height="62.0" fill="#2a78d6" fill-opacity="0.9"/><text x="694.5" y="240.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#ffffff" text-anchor="start" font-weight="700">8</text><text x="694.5" y="260.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="start" font-weight="normal">under review</text><text x="874.5" y="244.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">68% in abeyance</text><text x="274.0" y="342.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="normal">Asks FDA to revoke, remove or prohibit one</text><text x="274.0" y="384.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal">7 petitions</text><rect x="300.0" y="326.0" width="157.5" height="62.0" fill="#eb6834" fill-opacity="0.9"/><text x="312.0" y="356.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#ffffff" text-anchor="start" font-weight="700">7</text><text x="312.0" y="376.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="start" font-weight="normal">under review</text><text x="469.5" y="360.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">0% in abeyance</text><text x="40.0" y="468.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">By petition class:  Colour additive 13  ·  Food additive 11  ·  Irradiation 5  ·  Food contact 3</text><text x="40.0" y="508.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">Why this is structural, not a bias finding</text><text x="40.0" y="530.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">FDA defines abeyance as the state a petition sits in until the petitioner supplies information FDA has asked for, requests a decision on what is already filed,</text><text x="40.0" y="548.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">or withdraws. It is a queue for petitions where the petitioner owes data — which is what proving a new additive safe involves, and is not what asking FDA to</text><text x="40.0" y="566.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">revoke someone else's additive involves. So the split above is close to a definition rather than a discovery, and “held in abeyance” must not be read as a</text><text x="40.0" y="584.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">neutral measure of delay when these two groups are compared later.</text><text x="40.0" y="674.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: FDA Office of Food Additive Safety, petitions under review or held in abeyance, as of 2026-08-19. Captured by wss-food-trace; petitioner names are not collected.</text></svg>